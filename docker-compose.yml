services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: bds-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - type: bind
        source: ../dataset/5792100/unipi_ais_dynamic_2018
        target: /input/unipi_ais_dynamic_2018
        read_only: true
    env_file:
      - ./docker/hdfs/hadoop.env
    environment:
      CLUSTER_NAME: bds-hdfs

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: bds-datanode
    restart: unless-stopped
    ports:
      - "9864:9864"
    env_file:
      - ./docker/hdfs/hadoop.env
    environment:
      SERVICE_PRECONDITION: namenode:9870
    depends_on:
      - namenode

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: bds-spark-master
    restart: unless-stopped
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      INIT_DAEMON_STEP: setup_spark
      SPARK_MASTER_HOST: spark-master
    depends_on:
      - namenode
      - datanode

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: bds-spark-worker-1
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: bds-spark-worker-2
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
