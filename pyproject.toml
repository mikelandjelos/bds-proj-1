[project]
name = "bds-proj-1"
version = "0.1.0"
description = "Big Data Systems project 1 (Piraeus AIS analytics with Spark)"
requires-python = ">=3.10,<3.13"
dependencies = ["pyspark>=3.5,<4.0"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = ">=24.0,<25.0"
isort = ">=5.13,<6.0"
ruff = ">=0.6,<1.0"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
